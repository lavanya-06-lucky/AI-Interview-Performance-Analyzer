<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Results</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 520px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.row {
  display: flex;
  gap: 20px;
}

.col {
  width: 50%;
  background: #f4f6f8;
  padding: 15px;
  border-radius: 10px;
  font-size: 14px;
}

h2 {
  text-align: center;
  margin-bottom: 15px;
}

.title {
  font-weight: bold;
  margin-bottom: 8px;
}
</style>
</head>

<body>

<div class="card">
  <h2>Evaluation Results</h2>

  <div class="row">
    <div class="col" id="scores">
      <div class="title">📊 Scores</div>
    </div>

    <div class="col" id="feedback">
      <div class="title">📝 Feedback</div>
    </div>
  </div>
</div>

<script>
const result = JSON.parse(sessionStorage.getItem("result"));

if (!result) {
  document.getElementById("scores").innerHTML += "No result found!";
} else {

  // ---- SCORES ----
  document.getElementById("scores").innerHTML += `
    👁 Eye Score: ${result.eye_score}<br><br>
    🧍 Posture Score: ${result.posture_score}<br><br>
    👀 Visual Score: ${result.visual_score}<br><br>
    🗣 Speech Score: ${result.speech_score}<br>
    <hr>
    <b>⭐ Final Score: ${result.final_score}</b>
  `;

  // ---- FEEDBACK (FIXED OBJECT ISSUE) ----
  let fbHTML = "";
  for (const key in result.feedback) {
    fbHTML += `• ${result.feedback[key]}<br><br>`;
  }

  document.getElementById("feedback").innerHTML += fbHTML;
}
</script>

</body>
</html>
